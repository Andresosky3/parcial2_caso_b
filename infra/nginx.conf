server {
    listen 80;
    server_name danielmiguel.si-umng.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name danielmiguel.si-umng.com;

    ssl_certificate     /etc/letsencrypt/live/danielmiguel.si-umng.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/danielmiguel.si-umng.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Headers de seguridad — Pregunta 3.1
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://danielmiguel.si-umng.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Juego Phaser
    location / {
        root /var/www/pixelforge/game;
        try_files $uri $uri/ /index.html;
    }

    # Portal Angular
    location /portal/ {
        alias /var/www/pixelforge/dist/pixelforge-portal/;
        try_files $uri $uri/ /portal/index.html;
    }

    # API FastAPI
    location /api/ {
        proxy_pass http://10.0.0.11:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Powered-By;
    }
}