server {
    listen 80;
    listen [::]:80;

    server_name danielmiguelbrian.si-umng.com 100.55.213.181;

    return 301 https://danielmiguelbrian.si-umng.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name danielmiguelbrian.si-umng.com 100.55.213.181;

    ssl_certificate /etc/letsencrypt/live/danielmiguelbrian.si-umng.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/danielmiguelbrian.si-umng.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://danielmiguelbrian.si-umng.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location = / {
        return 302 /portal/;
    }

    location = /portal/ {
        root /var/www/pixelforge/dist/pixelforge-portal;
        try_files /index.html =404;
    }

    location /portal/ {
        alias /var/www/pixelforge/dist/pixelforge-portal/;
        index index.html;
        try_files $uri $uri/ /portal/index.html;
    }

    location /game/ {
        alias /var/www/pixelforge/game/;
        index index.html;
        try_files $uri $uri/ /game/index.html;
    }

    location /api/ {
        proxy_pass http://172.26.1.31:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}